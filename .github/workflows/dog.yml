name: Generate contribution dog

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate dog.svg
        run: |
          node scripts/generate-dog.mjs --user iceicepolar --out dist/dog.svg --palette light
          node scripts/generate-dog.mjs --user iceicepolar --out dist/dog-dark.svg --palette dark

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4.0.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
